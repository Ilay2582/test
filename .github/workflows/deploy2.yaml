name: Stage2-07-Map-ApiGateway

on:
  push:
    branches:
      - corgi

permissions:
  contents: read
  id-token: write

jobs:
  map:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Inspect REST API
        run: |
          aws apigateway get-rest-api \
            --rest-api-id l8ssyaz69f \
            --output json || true

      - name: List REST API resources
        run: |
          aws apigateway get-resources \
            --rest-api-id l8ssyaz69f \
            --output json || true

      - name: Inspect code_exec method
        run: |
          aws apigateway get-method \
            --rest-api-id l8ssyaz69f \
            --resource-id \
              "$(aws apigateway get-resources \
                --rest-api-id l8ssyaz69f \
                --query 'items[?contains(path, `code_exec`)].id' \
                --output text)" \
            --http-method POST \
            --output json || true

      - name: Inspect code_exec integration
        run: |
          RESOURCE_ID=$(aws apigateway get-resources \
            --rest-api-id l8ssyaz69f \
            --query 'items[?contains(path, `code_exec`)].id' \
            --output text)

          aws apigateway get-integration \
            --rest-api-id l8ssyaz69f \
            --resource-id "$RESOURCE_ID" \
            --http-method POST \
            --output json || true

      - name: Inspect HTTP APIs if applicable
        run: |
          aws apigatewayv2 get-apis \
            --output json || true
