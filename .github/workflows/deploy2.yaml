name: Stage2

on:
  push:
    branches:
      - corgi

permissions:
  contents: read
  id-token: write

jobs:
  recon:
    runs-on: ubuntu-latest

    steps:
      - name: Assume target CICD role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Verify account
        run: |
          aws sts get-caller-identity

      - name: Read user bucket policy
        continue-on-error: true
        run: |
          aws s3api get-bucket-policy \
            --bucket userad88e2b168aa387e \
            --output text

      - name: Read log bucket policy
        continue-on-error: true
        run: |
          aws s3api get-bucket-policy \
            --bucket logad88e2b168aa387e \
            --output text

      - name: Read bucket locations
        continue-on-error: true
        run: |
          aws s3api get-bucket-location \
            --bucket userad88e2b168aa387e

          aws s3api get-bucket-location \
            --bucket logad88e2b168aa387e
