name: Stage2-02-Identify-Source-Marker

on:
  push:
    branches:
      - corgi

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      API_URL: https://l8ssyaz69f.execute-api.us-east-1.amazonaws.com/dev/code_exec

    steps:
      - name: Install dependencies
        run: |
          python3 -m pip install requests requests-aws4auth --quiet

      - name: Identify source marker
        run: |
          python3 - <<'PY'
          import os
          import base64
          import requests
          from requests_aws4auth import AWS4Auth

          auth = AWS4Auth(
              os.environ["AWS_ACCESS_KEY_ID"],
              os.environ["AWS_SECRET_ACCESS_KEY"],
              "us-east-1",
              "execute-api",
              session_token=os.environ["AWS_SESSION_TOKEN"]
          )

          markers = [
              "subprocess",
              "shell=True",
              "nslookup",
              "lambda_handler",
              "domain = event.get"
          ]

          for marker in markers:
              code = f'''
          import subprocess

          command = [
              "/bin/sh",
              "-c",
              "grep -a -q {marker!r} /var/task/lambda_function.py"
          ]

          result = subprocess.run(command)

          raise SystemExit(7 if result.returncode == 0 else 9)
          '''

              encoded = base64.b64encode(code.encode()).decode()

              response = requests.post(
                  os.environ["API_URL"],
                  json={"code": encoded},
                  auth=auth,
                  timeout=40
              )

              print(f"MARKER={marker}")
              print(response.text)
              print("---")
          PY
