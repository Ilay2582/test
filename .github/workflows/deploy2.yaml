name: Stage2-08-Inspect-Lambda-Policy

on:
  push:
    branches:
      - corgi

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Inspect Lambda resource policy
        run: |
          aws lambda get-policy \
            --function-name nslookupv2 \
            --output json || true

      - name: Inspect Lambda versions and aliases
        run: |
          aws lambda list-versions-by-function \
            --function-name nslookupv2 \
            --output json || true

          aws lambda list-aliases \
            --function-name nslookupv2 \
            --output json || true
