name: Stage2-Lambda-Tools

on:
  push:
    branches:
      - corgi

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
      API_URL: https://l8ssyaz69f.execute-api.us-east-1.amazonaws.com/dev/code_exec

    steps:
      - name: Install dependencies
        run: |
          python3 -m pip install requests requests-aws4auth --quiet

      - name: Inspect Lambda binaries
        run: |
          python3 - <<'PY'
          import os
          import base64
          import requests
          from requests_aws4auth import AWS4Auth

          code = r'''
          import os
          import shutil

          candidates = [
              "/opt/aws",
              "/opt/nslookup",
              "/opt/bin/aws",
              "/var/lang/bin/aws",
              "/var/runtime/aws",
              "/usr/local/bin/aws",
              "/usr/bin/aws",
              "/bin/sh",
              "/bin/busybox",
              "/usr/bin/curl",
              "/usr/bin/wget",
              "/var/task/lambda_function.py"
          ]

          found = []

          for path in candidates:
              if os.path.exists(path):
                  found.append(path)

          for name in ["aws", "nslookup", "curl", "wget", "sh"]:
              path = shutil.which(name)
              if path and path not in found:
                  found.append(path)

          if found:
              raise SystemExit(20 + min(len(found), 200))

          raise SystemExit(9)
          '''

          encoded = base64.b64encode(code.encode()).decode()

          auth = AWS4Auth(
              os.environ["AWS_ACCESS_KEY_ID"],
              os.environ["AWS_SECRET_ACCESS_KEY"],
              "us-east-1",
              "execute-api",
              session_token=os.environ["AWS_SESSION_TOKEN"]
          )

          response = requests.post(
              os.environ["API_URL"],
              json={"code": encoded},
              auth=auth,
              timeout=40
          )

          print(response.text)
          PY
