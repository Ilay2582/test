name: Stage2-04-Map-VPC-And-Lambda

on:
  push:
    branches:
      - corgi

permissions:
  contents: read
  id-token: write

jobs:
  map:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Identify current account
        run: |
          aws sts get-caller-identity

      - name: List VPCs
        run: |
          aws ec2 describe-vpcs \
            --query 'Vpcs[].{VpcId:VpcId,Cidr:CidrBlock,Tags:Tags}' \
            --output json

      - name: List VPC endpoints
        run: |
          aws ec2 describe-vpc-endpoints \
            --query 'VpcEndpoints[].{Id:VpcEndpointId,Vpc:VpcId,Service:ServiceName,State:State,Type:VpcEndpointType}' \
            --output json

      - name: List Lambda functions
        run: |
          aws lambda list-functions \
            --query 'Functions[].{Name:FunctionName,Role:Role,Runtime:Runtime}' \
            --output json

      - name: Inspect Lambda configurations
        run: |
          for function in $(aws lambda list-functions --query 'Functions[].FunctionName' --output text); do
            echo "===== FUNCTION: $function ====="
            aws lambda get-function-configuration \
              --function-name "$function" \
              --query '{Name:FunctionName,Role:Role,Vpc:VpcConfig,EnvironmentKeys:Environment.Variables}' \
              --output json
          done
