name: Stage2-06-Domain-Injection-Test

on:
  push:
    branches:
      - corgi

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      API_URL: https://l8ssyaz69f.execute-api.us-east-1.amazonaws.com/dev/code_exec

    steps:
      - name: Install dependencies
        run: |
          python3 -m pip install requests requests-aws4auth --quiet

      - name: Test domain event path
        run: |
          python3 - <<'PY'
          import os
          import requests
          from requests_aws4auth import AWS4Auth

          auth = AWS4Auth(
              os.environ["AWS_ACCESS_KEY_ID"],
              os.environ["AWS_SECRET_ACCESS_KEY"],
              "us-east-1",
              "execute-api",
              session_token=os.environ["AWS_SESSION_TOKEN"]
          )

          tests = [
              {
                  "name": "normal_domain",
                  "body": {
                      "domain": "example.com"
                  }
              },
              {
                  "name": "safe_injection_probe",
                  "body": {
                      "domain": "example.com; printf CTF_PROBE"
                  }
              },
              {
                  "name": "path_probe",
                  "body": {
                      "domain": "example.com; test -x /opt/nslookup"
                  }
              }
          ]

          for test in tests:
              response = requests.post(
                  os.environ["API_URL"],
                  json=test["body"],
                  auth=auth,
                  timeout=40
              )

              print(f"TEST={test['name']}")
              print(f"HTTP={response.status_code}")
              print(response.text)
              print("---")
          PY
