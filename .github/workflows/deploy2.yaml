name: Stage2-04-Public-Artifact-Probe

on:
  push:
    branches:
      - corgi

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Probe public site paths
        run: |
          set +e

          BASE="https://d4ysu55xg7wfi.cloudfront.net"

          paths="
          /
          /index.html
          /docs.html
          /robots.txt
          /sitemap.xml
          /.git/
          /.git/HEAD
          /.git/config
          /.git/index
          /.git/description
          /.git/logs/HEAD
          /.env
          /flag.txt
          /backup.zip
          /site.zip
          /source.zip
          /lambda_function.py
          /bucket_policy.json
          /policy.json
          "

          while IFS= read -r path; do
            [ -z "$path" ] && continue

            echo "===== $path ====="

            curl \
              --silent \
              --show-error \
              --location \
              --max-time 15 \
              --output /tmp/probe_body \
              --write-out "HTTP=%{http_code} SIZE=%{size_download} TYPE=%{content_type}\n" \
              "$BASE$path"

            head -c 300 /tmp/probe_body
            echo
            echo
          done <<< "$paths"
