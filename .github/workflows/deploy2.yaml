name: Stage2
on:
  push:
    branches: [corgi]

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Who am I
        run: aws sts get-caller-identity
        
      - name: Debug code_exec
        run: |
                pip install requests requests-aws4auth --quiet
                python3 << 'PYEOF'
                    import boto3, json, base64, requests
                    from requests_aws4auth import AWS4Auth
      
                    API = "https://l8ssyaz69f.execute-api.us-east-1.amazonaws.com/dev/code_exec"
      
                    session = boto3.Session()
                    creds = session.get_credentials().get_frozen_credentials()
                    auth = AWS4Auth(
                        creds.access_key,
                        creds.secret_key,
                        'us-east-1',
                        'execute-api',
                        session_token=creds.token
                    )
      
                  # נסה קוד הכי פשוט אפשרי
                  code = base64.b64encode(b'print("hello from lambda")').decode()
                  print("payload:", repr(code))
                  
                  r = requests.post(
                      API,
                      json={"code": code},
                      auth=auth
                  )
                  
                  print("status:", r.status_code)
                  print("headers:", dict(r.headers))
                  print("body:", r.text)
                  PYEOF
