name: Stage2

on:
  push:
    branches:
      - corgi

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Who am I
        run: |
          aws sts get-caller-identity

      - name: Lambda network probe
        run: |
          pip install boto3 requests requests-aws4auth --quiet
      
          cat > /tmp/probe.py <<'PY'
          import base64
          import requests
          import boto3
          from requests_aws4auth import AWS4Auth
      
          API = "https://l8ssyaz69f.execute-api.us-east-1.amazonaws.com/dev/code_exec"
      
          creds = boto3.Session().get_credentials().get_frozen_credentials()
      
          auth = AWS4Auth(
              creds.access_key,
              creds.secret_key,
              "us-east-1",
              "execute-api",
              session_token=creds.token,
          )
      
          lambda_code = r'''
          import socket
      
          try:
              socket.gethostbyname("s3.us-east-1.amazonaws.com")
              raise SystemExit(7)
          except Exception:
              raise SystemExit(9)
          '''
      
          encoded = base64.b64encode(lambda_code.encode()).decode()
      
          response = requests.post(
              API,
              json={"code": encoded},
              auth=auth,
          )
      
          print(response.status_code)
          print(response.text)
          PY
      
          python3 /tmp/probe.py
