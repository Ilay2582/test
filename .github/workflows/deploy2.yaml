name: Stage2
on:
  push:
    branches:
      - corgi
permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Who am I
        run: aws sts get-caller-identity

      - name: Fetch docs.html
        run: curl -s https://d4ysu55xg7wfi.cloudfront.net/docs.html
        
      - name: Enumerate with ctf_participant_role
        run: |
          echo "=== bucket policy ==="
          aws s3api get-bucket-policy --bucket userad88e2b168aa387e 2>&1 || true

          echo "=== bucket logging ==="
          aws s3api get-bucket-logging --bucket userad88e2b168aa387e 2>&1 || true

          echo "=== cloudfront distributions ==="
          aws cloudfront list-distributions \
            --query 'DistributionList.Items[].{Domain:DomainName,Origins:Origins.Items[].{Domain:DomainName,Headers:CustomHeaders.Items}}' \
            --output json 2>&1 || true

          echo "=== list buckets ==="
          aws s3api list-buckets 2>&1 || true

          echo "=== logad bucket logging ==="
          aws s3api get-bucket-logging --bucket logad88e2b168aa387e 2>&1 || true

          echo "=== userad bucket acl ==="
          aws s3api get-bucket-acl --bucket userad88e2b168aa387e 2>&1 || true
