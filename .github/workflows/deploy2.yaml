name: Stage2-05-Download-Lambda

on:
  push:
    branches:
      - corgi

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Identify Lambda
        run: |
          aws sts get-caller-identity
          aws lambda get-function-configuration \
            --function-name nslookupv2 \
            --query '{FunctionName:FunctionName,Role:Role,Runtime:Runtime,Handler:Handler,Layers:Layers,VpcConfig:VpcConfig}' \
            --output json

      - name: Download deployed Lambda package
        run: |
          URL=$(aws lambda get-function \
            --function-name nslookupv2 \
            --query 'Code.Location' \
            --output text)

          curl --fail --location "$URL" --output /tmp/nslookupv2.zip

          mkdir -p /tmp/nslookupv2
          unzip -l /tmp/nslookupv2.zip
          unzip -q /tmp/nslookupv2.zip -d /tmp/nslookupv2

      - name: Inspect deployed source
        run: |
          find /tmp/nslookupv2 -maxdepth 3 -type f -print

          echo "===== Python source files ====="
          find /tmp/nslookupv2 -type f -name '*.py' -exec sh -c '
            for file do
              echo "===== $file ====="
              sed -n "1,240p" "$file"
            done
          ' sh {} +

      - name: Search deployed package
        run: |
          rg -n -i \
            "subprocess|shell=True|nslookup|s3|bucket|user.?agent|sourcevpc|sourcevpce|flag|secret|exec|base64|lambda_handler" \
            /tmp/nslookupv2 || true
